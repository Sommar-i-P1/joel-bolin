
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sommar & Vinter i P1</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            height: 50px;
            background: #090909;
            display: flex;
            align-items: center;
            padding: 0 25%;
            gap: 30px;
        }

        .logo {
            font-size: 18px;
            color: #aaa;
        }

        nav {
            display: flex;
            gap: 20px;
            font-size: 12px;
        }

        .hero {
            height: 150px;
            background: linear-gradient(
                rgba(0,0,0,.45),
                rgba(0,0,0,.85)
            );
            padding: 65px 25%;
        }

        .hero h1 {
            font-size: 24px;
        }

        .container {
            width: 500px;
            margin: 0 auto;
        }

        .content {
            display: grid;
            grid-template-columns: 315px 175px;
            gap: 10px;
        }

        .main {
            background: #151515;
        }

        .program-image {
            width: 100%;
            height: 290px;
            object-fit: cover;
        }

        .main h2 {
            font-size: 18px;
            padding: 10px;
        }

        .people {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            padding: 4px;
        }

        .people img {
            width: 100%;
            height: 48px;
            object-fit: cover;
        }

        .episodes {
            border: 1px solid #292929;
            background: #111;
        }

        .episodes h2 {
            font-size: 16px;
            padding: 10px;
            border-bottom: 1px solid #292929;
        }

        .episode {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 10px;
            border-bottom: 1px solid #292929;
            font-size: 10px;
        }

        .episode .circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background: #080808;
            border-top: 1px solid #292929;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .play {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">sverigesradio</div>

        <nav>
            <span>Nyheter</span>
            <span>Poddar & program</span>
            <span>Kanaler</span>
            <span>Mer⌄</span>
        </nav>
    </header>

    <section class="hero">
        <h1>Sommar & Vinter i P1</h1>
    </section>

    <main class="container">

        <div class="content">

            <section class="main">

                <img
                    class="program-image"
                    src="https://picsum.photos/600/500"
                    alt="Sommarpratare"
                >

                <h2>Här är årets mest lyssnade Sommarprat</h2>

                <div class="people">
                    <img src="https://picsum.photos/100/100?1">
                    <img src="https://picsum.photos/100/100?2">
                    <img src="https://picsum.photos/100/100?3">
                    <img src="https://picsum.photos/100/100?4">
                    <img src="https://picsum.photos/100/100?5">
                    <img src="https://picsum.photos/100/100?6">
                    <img src="https://picsum.photos/100/100?7">
                    <img src="https://picsum.photos/100/100?8">
                </div>

            </section>

            <aside class="episodes">

                <h2>Senaste avsnitt</h2>

                <div class="episode">
                    <span class="circle">▶</span>
                    <div>
                        <b>Niklas Rådström</b><br>
                        66 min
                    </div>
                </div>

                <div class="episode">
                    <span class="circle">▶</span>
                    <div>
                        <b>Felicia Eriksson</b><br>
                        57 min
                    </div>
                </div>

                <div class="episode">
                    <span class="circle">▶</span>
                    <div>
                        <b>Sofia Dalén</b><br>
                        68 min
                    </div>
                </div>

                <div class="episode">
                    <span class="circle">▶</span>
                    <div>
                        <b>Mohamed Fashame</b><br>
                        65 min
                    </div>
                </div>

            </aside>

        </div>

    </main>

    <div class="player">
        <span>◀</span>
        <span>◀</span>
        <span class="play">▶</span>
        <span>▶</span>
        <span>Volym 🔊</span>
    </div>

</body>
</html>
